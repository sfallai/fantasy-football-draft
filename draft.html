<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Assistant</title>
<style>:root {
  --bg: #0f1116;
  --panel: #181b23;
  --panel-2: #1f232d;
  --border: #2a2f3a;
  --text: #e6e8ed;
  --muted: #8b93a5;
  --accent: #fbbf24;
  --qb: #ef4444;
  --rb: #3b82f6;
  --wr: #22c55e;
  --te: #f97316;
  --k: #9ca3af;
  --def: #9ca3af;

  /* Stacking order, stated once. Popovers are appended to document.body, the same
     stacking context as the tour overlay, so anything below --z-tour paints under a
     62%-black wash for the whole tour — and both tours tell people to open exactly
     these things (a board square, a team header, the keeper picker). Every popover
     therefore sits ABOVE the tour, keeping their order among themselves. */
  --z-tour: 60;
  --z-dropdown: 70;
  --z-pop: 80;
  --z-roster-pop: 90;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

button {
  font: inherit;
  color: var(--text);
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #1a1205; border-color: var(--accent); font-weight: 600; }

input, select {
  font: inherit;
  color: var(--text);
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
}
input:focus, select:focus { outline: 1px solid var(--accent); }

/* ---- Layout ---- */
.layout {
  display: grid;
  grid-template-columns: 260px minmax(420px, 1fr) minmax(520px, 1.1fr);
  gap: 12px;
  padding: 12px;
  height: 100vh;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  overflow: auto;
  min-height: 0;
}
.panel h2 {
  margin: 0 0 10px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ---- Setup ---- */
.setup { max-width: 900px; margin: 32px auto; padding: 24px; }
.setup h1 { margin-top: 0; }
.field-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
.pos-grid { display: flex; gap: 6px; flex-wrap: wrap; }
.pos-btn { width: 40px; text-align: center; }
.pos-btn.selected { background: var(--accent); color: #1a1205; border-color: var(--accent); }
/* Fixed height so changing the team count never moves the Start Draft button below it.
   462px fits the default 10-team league exactly (459px of rows plus the 1px borders
   that box-sizing folds in); larger leagues scroll inside the box. */
.teams-scroll { height: 462px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; }
table.teams { width: 100%; border-collapse: collapse; }
table.teams th, table.teams td { padding: 4px 6px; border-bottom: 1px solid var(--border); text-align: left; }
table.teams th { position: sticky; top: 0; z-index: 1; background: var(--panel); font-size: 12px; color: var(--muted); font-weight: 500; }

/* ---- My team ---- */
.slot { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border); }
.slot .label { color: var(--muted); font-size: 12px; width: 40px; flex: none; }
.slot .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .name.empty { color: #4b5263; font-style: italic; }
.slot .meta { color: var(--muted); font-size: 11px; flex: none; white-space: nowrap; }
.pos-counts { margin-top: 14px; color: var(--muted); font-size: 12px; letter-spacing: 0.02em; white-space: pre-wrap; }
.needs { margin-top: 14px; }
.need-row { display: flex; justify-content: space-between; padding: 3px 0; }
.need-row.set { color: var(--muted); }
.tier { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
.tier-high { color: #f87171; font-weight: 600; }
.tier-medium { color: var(--accent); }
.tier-low { color: var(--muted); }
.tier-bench { color: #5d6577; }
.tier-none { color: #4b5263; }

/* ---- Center ---- */
.pickbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.pickbar input { flex: 1; }
.pick-info { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.pick-info .round { font-size: 20px; font-weight: 600; }
.pick-info .who { color: var(--muted); }
.pick-info .who.mine { color: var(--accent); font-weight: 600; }

.suggest { position: relative; }
.suggest-list {
  position: absolute; z-index: var(--z-dropdown); left: 0; right: 0; top: 100%;
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
  max-height: 260px; overflow: auto;
}
.suggest-list div { padding: 6px 8px; cursor: pointer; }
.suggest-list div.active, .suggest-list div:hover { background: #2b3140; }

.rec { border: 1px solid var(--border); border-left-width: 4px; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--panel-2); }
.rec .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rec .pname { font-size: 16px; font-weight: 600; }
.rec .meta { color: var(--muted); font-size: 12px; }
.rec .why { color: #c3c9d6; font-size: 12px; margin-top: 4px; }
.rec.sleeper { border-left-style: dashed; }
.rec .gamble { font-size: 9px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 4px; margin-left: 6px; }
.rec .bye-warn { color: var(--te); font-size: 11.5px; margin-top: 3px; }
.notes { border: 1px solid #4a3a12; background: #241d08; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; font-size: 12px; }

table.players { width: 100%; border-collapse: collapse; font-size: 13px; }
table.players th { position: sticky; top: 0; background: var(--panel); text-align: left; padding: 4px 6px; font-size: 11px; color: var(--muted); cursor: pointer; border-bottom: 1px solid var(--border); }
table.players td { padding: 3px 6px; border-bottom: 1px solid #22262f; }
table.players tr:hover td { background: #22262f; }
/* The real scroll container on both axes. `overflow-x: auto` alone made overflow-y
   compute to auto, so this became a scrollport that never scrolled — and the sticky
   header resolved against it and scrolled away with the panel. A height constraint
   is what makes the pin work. */
.tablewrap { overflow: auto; }
.panel.center { display: flex; flex-direction: column; }
/* The centre panel must never be the scroller itself. It was: `.panel` sets
   `overflow: auto`, and once the chrome above the table exceeded panelHeight − 120px
   the panel scrolled instead of the table — and renderCenter's post-render
   filterInput.focus() then scrolled the round/pick header and the Undo and Skip
   buttons off the top on every single pick. `overflow: hidden` here takes that away;
   the one variable-height block (notes, recommendations, sleepers) gets its own
   scrollport below so long recommendations still reach the user. */
.panel.center { overflow: hidden; }
/* Chrome that must never move: the round/pick header, the Undo/Skip bar, the Players
   heading and the filter row all stay pinned by simply refusing to shrink. */
.panel.center > .pick-info,
.panel.center > .pickbar,
.panel.center > h2,
.panel.center > .filters { flex: 0 0 auto; }
/* min-height: 0 is the load-bearing part: without it this scroller's flex automatic
   minimum size is its content height, so it would refuse to shrink and push the table
   past the bottom of the panel. */
.panel.center .center-scroll { flex: 0 1 auto; overflow: auto; min-height: 0; }
/* The explicit min-height is what keeps a few rows visible when the block above is
   long. An explicit min-height always overrides the flexbox automatic minimum size —
   that has nothing to do with `overflow: auto`, which only zeroes the *automatic*
   minimum when no explicit one is given. */
/* basis 0, not auto. With `auto` the table's flex basis is its own content height —
   about 8000px for a 400-row unfiltered pool — so the container is wildly
   over-subscribed and both children shrink in proportion to their basis. The
   recommendations block (basis ~150px) lost 150/8150 of the overflow and collapsed to
   roughly 13px: one suggestion, cut off. A zero basis takes the table's content height
   out of that sum entirely, so the block above keeps its natural height and the table
   grows into whatever is left. Filtering to one position hid the bug, because 20 rows
   never over-subscribe anything. */
.panel.center .tablewrap { flex: 1 1 0; min-height: 120px; }
/* Shown only while something is still below the fold — see setScrollHint in center.js.
   `pointer-events: none` so the fade never swallows a click on a card underneath. */
.center-scroll { position: relative; }
.center-scroll.has-more::after {
  content: ''; position: sticky; display: block; bottom: 0; height: 24px; margin-top: -24px;
  pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--panel));
}
table.players tr.taken td { color: #545b6b; }
table.players tr.taken:hover td { background: transparent; }
table.players td.owner { color: var(--muted); font-style: italic; white-space: nowrap; }
.rookie { font-size: 9px; font-weight: 600; letter-spacing: 0.04em; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 3px; margin-right: 5px; vertical-align: middle; }
.filters { display: flex; gap: 6px; align-items: center; margin: 10px 0 6px; flex-wrap: wrap; }
.filters button.selected { background: var(--accent); color: #1a1205; }
.pop { position: fixed; z-index: var(--z-pop); background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; max-width: 300px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.45); }
.pop h3 { margin: 0 0 6px; font-size: 13px; }
.pop dt { color: var(--accent); font-weight: 600; margin-top: 6px; }
.pop dd { margin: 0; color: var(--muted); }

/* ---- Board ---- */
table.board { border-collapse: collapse; font-size: 11px; width: 100%; table-layout: fixed; }
table.board th { padding: 4px 3px; border: 1px solid var(--border); color: var(--muted); font-weight: 500; cursor: pointer; }
table.board th.mine { color: var(--accent); }
table.board td { border: 1px solid var(--border); padding: 3px; height: 26px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
table.board td.mine-col { background: #1c2130; }
table.board td.current { outline: 2px solid var(--accent); outline-offset: -2px; animation: pulse 1.4s ease-in-out infinite; }
table.board td.keeper::after { content: "K"; float: right; font-size: 9px; color: var(--accent); font-weight: 700; }
table.board .rnd { color: var(--muted); text-align: center; width: 28px; }
@keyframes pulse { 0%, 100% { background: #2b2410; } 50% { background: #3a3016; } }

/* max-height + overflow, or the tail is unreachable: a full 15-round roster with its
   slots, needs, picks list and grade runs to ~960px, taller than a 13" laptop viewport.
   showPopover clamps top to max(0, innerHeight - height), so an over-tall popover pins
   to top: 0 and everything past the fold — the picks and the grade — simply cannot be
   seen, because nothing scrolls. Capped, that clamp is correct and the rest scrolls. */
.roster-pop { position: fixed; z-index: var(--z-roster-pop); background: var(--panel-2); border: 1px solid var(--accent); border-radius: 8px; padding: 10px; max-width: 260px; max-height: 80vh; overflow-y: auto; font-size: 12px; }
.pop-offlist { margin-top: 6px; color: var(--muted); font-size: 11px; font-style: italic; }
table.board th .team-grade { font-size: 10px; font-weight: 600; color: var(--accent); letter-spacing: 0.04em; }
.pop-pick { display: grid; grid-template-columns: 28px 1fr 40px; gap: 6px; align-items: baseline; padding: 2px 0; font-size: 11px; }
.pop-pick-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop-pick .meta { text-align: right; font-variant-numeric: tabular-nums; }
.pop-grade { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border); font-weight: 600; }

.pop.editor input { width: 100%; margin-top: 6px; }
.cand-list { margin-top: 6px; max-height: 200px; overflow: auto; }
.cand { padding: 5px 6px; cursor: pointer; border-radius: 4px; }
.cand:hover { background: #2b3140; }
/* Only a filled cell has an edit handler, so only a filled cell offers the pointer. */
table.board td.cell.filled { cursor: pointer; }
.cand.offlist { margin-top: 6px; border-top: 1px solid var(--border); border-radius: 0 0 4px 4px; color: var(--muted); }
.cand-more { padding: 5px 6px; color: var(--muted); font-style: italic; }

.freshness { color: var(--muted); font-size: 11px; padding: 6px 12px; text-align: right; }
/* Matches .setup's own box (max-width: 900px; margin: 32px auto) so the line's right
   edge lines up with the card's, not the browser window's — .freshness is a sibling
   of .setup, not a child, so it needs its own copy of the same width and centering. */
.freshness-card { max-width: 900px; margin: 0 auto; }
/* Same trick for the summary screen, whose card is 620px wide rather than 900px. */
.freshness-summary { max-width: 620px; margin: 0 auto; }

/* ---- Summary ---- */
.summary { max-width: 620px; margin: 40px auto; padding: 0 16px; }
.sum-head, .sum-row { display: grid; grid-template-columns: 32px 1fr 56px 84px; gap: 8px; align-items: baseline; padding: 7px 8px; border-bottom: 1px solid var(--border); }
.sum-head { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.sum-row.mine { background: #22262f; border-radius: 6px; }
.sum-grade { font-weight: 600; color: var(--accent); }
.sum-pts { text-align: right; font-variant-numeric: tabular-nums; }
/* The header cells are deliberately unclassed — sharing the data rows' classes made
   class-based test queries match the header labels too. Alignment is positional, so the
   last column needs its own rule to sit over the right-aligned numbers. */
.sum-head span:last-child { text-align: right; }

/* The report shares the summary's 620px column: it is the same document, continued. */
.sum-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sum-title h1 { margin: 0; }
.report { margin-top: 32px; }
.rep-section { margin-bottom: 28px; }
.rep-section h2 {
  margin: 0 0 10px; font-size: 12px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted);
}
/* Sits between the heading and the rows, so it is set like the heading rather than
   like a fact: this is the one line in the report that defines a word instead of
   stating a measurement. */
.rep-note { margin: -4px 0 8px; font-size: 12px; color: var(--muted); }
.rep-line { padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.rep-line:last-child { border-bottom: none; }
.rep-pos {
  display: inline-block; width: 34px; color: var(--accent);
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
}
.rep-team { margin-bottom: 18px; }
.rep-team h3 { margin: 0 0 4px; font-size: 14px; }
/* var(--text), not a hardcoded #c3c9d6: the spine names players, exactly as the
   .rep-line rows around it do, and every neighbouring rule here is on a token. */
.rep-spine { padding: 5px 0; font-size: 13px; color: var(--text); }
.rep-label {
  display: inline-block; width: 52px; color: var(--muted);
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
}
/* The report is five screens long and Back to draft otherwise lives only in the
   header, above all of it. */
.rep-back { margin-top: 4px; }

/* ---- Guided tour ---- */
.tour-layer { position: fixed; inset: 0; z-index: var(--z-tour); pointer-events: none; }
.tour-ring { position: fixed; border: 2px solid var(--accent); border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.62); pointer-events: none; }
.tour-dim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.62); }
.tour-card { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); width: min(420px, calc(100vw - 32px)); background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; box-shadow: 0 12px 40px rgba(0,0,0,.5); pointer-events: auto; }
.tour-card.centred { top: 50%; bottom: auto; transform: translate(-50%, -50%); }
.tour-card h3 { margin: 4px 0 6px; font-size: 15px; }
.tour-card p { margin: 0; color: var(--text); font-size: 13px; line-height: 1.5; }
.tour-count { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.tour-controls { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
.tour-controls .tour-skip { margin-right: auto; color: var(--muted); }
.tour-offer { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; color: var(--muted); font-size: 13px; }
/* Quiet on purpose: declining the tour is not a call to action, and a second button
   with the same weight as "Show me around" would read as a second offer. */
.tour-offer .btn-dismiss { border-color: transparent; background: transparent; color: var(--muted); padding: 2px 8px; font-size: 15px; line-height: 1; }
.tour-offer .btn-dismiss:hover { border-color: var(--border); color: var(--text); }

/* ---- Print ----
   The app is dark-on-dark. Printed as-is it is a black rectangle, and on a colour
   printer an expensive one, so the print sheet is not a nicety — it is the whole of
   the export feature. "Save as PDF" lives in every browser's print dialog, which is
   why exporting needs no download code and no dependency.

   Only tokens are redefined where possible, so the rules above keep applying and the
   two themes cannot drift apart. */
@media print {
  :root {
    --bg: #fff;
    --panel: #fff;
    --panel-2: #fff;
    --border: #ccc;
    --text: #000;
    --muted: #444;
    --accent: #000;
  }

  /* The screen column is 620px because that is a comfortable reading measure; a sheet
     of paper already is one, and the margin is the printer's job. */
  .summary { max-width: none; margin: 0; padding: 0; }
  .freshness-summary { max-width: none; }

  /* Controls do not survive a page. Back to draft, print, and the tour overlay if one
     is somehow open. */
  .sum-title button, .rep-back, .pop, .roster-pop,
  .tour-layer, .tour-ring, .tour-dim, .tour-card {
    display: none !important;
  }

  /* On screen your own team is a filled panel. On paper that is a block of ink for no
     information, so the same fact is carried by weight and a rule instead.
     A border, not the inset box-shadow this first used: browsers print with background
     graphics OFF by default and drop box-shadow along with backgrounds, so the bar
     would have vanished for most people — and it is the only mark saying which of
     twelve teams belongs to whoever is holding the page. font-weight alone is a weak
     signal at 14px. Borders print regardless of that setting. */
  .sum-row.mine {
    background: none; font-weight: 600;
    border-left: 2px solid #000; padding-left: 6px;
  }
  .sum-grade { color: #000; font-weight: 700; }

  /* A team's note split across a page boundary is the one break that loses meaning —
     a bye-week clash reads as a different team's.
     NOT .rep-section: "Team by team" holds every team block, so for a twelve-team
     league it is taller than a page. An unfittable avoid gets retried at the top of the
     next page before the engine gives up, so it would abandon whatever was left of the
     previous sheet and then break internally regardless — .rep-team already handles the
     break that matters. A waivers row wraps to two or three lines and splits the same
     way, so it gets the same protection. */
  .rep-team, .rep-line { break-inside: avoid; page-break-inside: avoid; }
  .rep-section h2, .rep-team h3 { break-after: avoid; page-break-after: avoid; }

  /* Ctrl+P works on every screen, and someone will eventually press it on the draft
     board. Before this sheet existed that produced an obviously broken black rectangle
     nobody would keep. Without these rules it produces a plausible-looking page that is
     silently truncated at the first fold — a worse failure for people who will not
     report it as a bug. Only the summary was designed for print; these three make the
     others merely long instead of lossy. */
  .layout { height: auto; display: block; }
  .panel, .tablewrap, .panel.center, .panel.center .center-scroll { overflow: visible; }
  .teams-scroll { height: auto; overflow-y: visible; }
  table.teams th, table.players th { position: static; }
  /* --accent is black in print, and these three pair an accent BACKGROUND with #1a1205
     text — black on black for anyone printing with background graphics on. */
  button.primary, .pos-btn.selected, .filters button.selected { background: none; color: #000; }

  /* The report's rules and the ranking table's are on the same left edge, so they have
     to be the same weight; #ddd made the lower half of the page visibly fainter and is
     the grey a printer drops first. */
  .rep-line { border-bottom: 1px solid var(--border); }
  /* .summary loses its padding above, so the report's rows would sit 8px left of the
     ranking rows they line up under. */
  .rep-line, .rep-spine, .rep-note { padding-left: 8px; }
}
</style>
</head>

// Snake draft order. Rounds, team indices, and overall picks are all 1-based.

function pickToSlot(overallPick, numTeams) {
  const zero = overallPick - 1;
  const round = Math.floor(zero / numTeams) + 1;
  const indexInRound = zero % numTeams;
  // Odd rounds run 1..N, even rounds run N..1.
  const teamIndex = round % 2 === 1 ? indexInRound + 1 : numTeams - indexInRound;
  return { round, teamIndex };

  const indexInRound = round % 2 === 1 ? teamIndex - 1 : numTeams - teamIndex;
  return (round - 1) * numTeams + indexInRound + 1;

  return numTeams * rounds;

  const picks = [];
  for (let round = 1; round <= rounds; round += 1) {

  return picks.sort((a, b) => a - b);

  return null;
}

  const node = document.createElement(tag);

    if (value === null || value === undefined) continue;
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key === 'html') node.innerHTML = value;
    else if (key === 'dataset') Object.assign(node.dataset, value);
    else if (key === 'style') Object.assign(node.style, value);
    else if (key.startsWith('on') && typeof value === 'function') {
      node.addEventListener(key.slice(2).toLowerCase(), value);
    } else node.setAttribute(key, value);

// One module owns the open popover, so a second panel opening one closes the first.
// Were there two independent copies of this state, the board's roster popover and the
// centre panel's player detail could sit on screen at the same time, each unaware of
// the other.
let openNode = null;

// `.pop` is position: fixed above the table. Anchoring its corner exactly at the
// pointer puts it under the *second* click of a double-click, which then hit-tests
// onto the popover instead of the row — and the pick never happens. Offsetting clears
// the pointer; browsers cancel a dblclick only after the pointer moves several pixels,
// so 14px sits outside the double-click envelope without moving the popover far.
const OFFSET_X = 14;
const OFFSET_Y = 16;

// Used only when the node cannot report its own size yet (no layout, or a test stub).
const FALLBACK_WIDTH = 280;
const FALLBACK_HEIGHT = 400;

// Containment, not a { once: true } arming. addEventListener dedupes on
// (type, callback, capture) and `once` is not part of that key, so a one-shot listener
// that is never consumed — because the opening click called stopPropagation and never
// reached the document — would survive and swallow the next popover. Dismissing on a
// click *outside* the open node cannot desync from openNode: closePopover always
// removes exactly what showPopover added.
function dismissOnOutsideClick(event) {
  if (openNode && event && openNode.contains(event.target)) return;
  closePopover();
}

// Escape is how every other dismissable overlay on the web closes, and the pick
// editor is a keyboard surface — the input is focused, so the mouse is nowhere near
// the "click outside" the other listener waits for. Removed in closePopover exactly
// as the click listener is; chunk F's popover inherits both for free.
function dismissOnEscape(event) {
  if (event && event.key === 'Escape') closePopover();
}

function closePopover() {
  if (openNode && openNode.parentNode) openNode.parentNode.removeChild(openNode);
  openNode = null;
  document.removeEventListener('click', dismissOnOutsideClick);
  document.removeEventListener('keydown', dismissOnEscape);
}

function showPopover(node, event) {
  closePopover();
  node.style.left = `${event.clientX + OFFSET_X}px`;
  node.style.top = `${event.clientY + OFFSET_Y}px`;
  document.body.appendChild(node);
  openNode = node;

  // Measured after appending, because `.pop` sizes to its content: the centre panel's
  // player detail and the board's roster popover are nothing like the same height.
  // A zero measurement (no layout yet) falls back to the old constants.
  const rect = typeof node.getBoundingClientRect === 'function' ? node.getBoundingClientRect() : null;
  const width = (rect && rect.width) || FALLBACK_WIDTH;
  const height = (rect && rect.height) || FALLBACK_HEIGHT;
  node.style.left = `${Math.max(0, Math.min(event.clientX + OFFSET_X, window.innerWidth - width))}px`;
  node.style.top = `${Math.max(0, Math.min(event.clientY + OFFSET_Y, window.innerHeight - height))}px`;

  // Not deferred, unlike the click listener: no keystroke opened this popover, so
  // there is nothing for an immediate arming to swallow.
  document.addEventListener('keydown', dismissOnEscape);

  // Deferred, or the click that opened this popover immediately closes it.
  setTimeout(() => document.addEventListener('click', dismissOnOutsideClick), 0);
}

__def("ui/report.js", function (__exports, __req) {
const { el } = __req('ui/dom.js');

// Every line here states a computed fact. A section with nothing to say is omitted
// rather than padded, and nothing is phrased as judgement: "34 picks after an ADP of
// 62" is a measurement, "a steal of the draft" is the app claiming an authority it does
// not have. It would also be obviously templated by the third team.
// `note` is a once-per-section gloss, not a per-line one — see the blind spot below,
// where the alternative was repeating the same definition on every row.
function section(title, lines, note = null) {
  if (lines.length === 0) return null;
  return el('div', { class: 'rep-section' }, [
    el('h2', { text: title }, []),
    note ? el('p', { class: 'rep-note', text: note }, []) : null,
    ...lines,
  ]);
}

const line = (text) => el('div', { class: 'rep-line', text }, []);

// One helper for all four ADP lines. "1 picks before his ADP of 4" appeared six times
// in a single simulated draft, three of them in the headline reaches section, because
// the rule was known and applied only in blindSpotLine.
//
// The delta arrives from the core as a whole number of picks against the ADP as it is
// displayed, so nothing here rounds it: the sign is carried by the words "after" and
// "before", and the count is a magnitude.
const picks = (n) => (n === 1 ? '1 pick' : `${n} picks`);

// "an ADP", never "his ADP": the possessive adds nothing, and it was wrong outright on
// the D/ST lines this report used to be full of.
//
// `shownAdp`, not `Math.round(v.adp)`: the core measured the gap against the rounded
// ADP, so printing a second, independent rounding beside it is two derivations of the
// one guarantee this section rests on — that the ADP and the gap add back up to the
// pick number. There is now one derivation, in pickValues, and this prints it.
const fellTo = (v) => `${picks(v.delta)} after an ADP of ${v.shownAdp}`;
const wentAt = (v) => `${picks(-v.delta)} before an ADP of ${v.shownAdp}`;

function waiverLines(waivers) {
  return waivers.map((group) => el('div', { class: 'rep-line' }, [
    el('span', { class: 'rep-pos', text: group.position }, []),
    el('span', {
      text: group.players
        .map((pl) => `${pl.name} — ${pl.projectedPoints.toFixed(1)} (rank ${pl.overallRank})`)
        .join(', '),
    }, []),
  ]));
}

function stealLine(v) {
  return line(`Round ${v.round} · ${v.teamName} — ${v.player.name}, ${fellTo(v)}`);
}

// The delta is stored negative; the sign is carried by the word "before", so the
// number is rendered as a magnitude. "-45 picks before" reads as a double negative.
function reachLine(v) {
  return line(`Round ${v.round} · ${v.teamName} — ${v.player.name}, ${wentAt(v)}`);
}

function blindSpotLine(spot) {
  const plural = spot.count === 1 ? '' : 's';
  const best = spot.best ? ` The best still there is ${spot.best.name}, at ${spot.best.projectedPoints.toFixed(1)}.` : '';
  return line(`${spot.count} startable ${spot.position}${plural} went undrafted — anyone projecting above the replacement level of ${spot.bar.toFixed(1)}.${best}`);
}

function benchLine(b) {
  return line(`Round ${b.round} · ${b.teamName} — ${b.player.name} does not make their starting lineup.`);
}

function teamBlock(team) {
  const lines = [];
  if (team.spine.length > 0) {
    lines.push(el('div', { class: 'rep-spine' }, [
      el('span', { class: 'rep-label', text: 'Spine' }, []),
      el('span', { text: team.spine.map((s) => `${s.label} ${s.player.name}`).join(' · ') }, []),
    ]));
  }
  for (const clash of team.clashes) {
    lines.push(line(`${clash.players.length} starters are off in Week ${clash.week}: ${clash.players.map((p) => p.name).join(', ')}`));
  }
  if (team.bestValue) {
    lines.push(line(`Best value: ${team.bestValue.player.name}, ${fellTo(team.bestValue)}`));
  }
  if (team.biggestReach) {
    lines.push(line(`Earliest pick: ${team.biggestReach.player.name}, ${wentAt(team.biggestReach)}`));
  }
  return el('div', { class: 'rep-team' }, [
    el('h3', { text: team.name }, []),
    ...lines,
  ]);

// One sentence, once, at the top of the section rather than on each of its four
// possible rows. "the replacement level of 288.3" is jargon on a screen written for
// people who have never drafted; the VBD column elsewhere at least has a tooltip.

  + 'nobody has to start projects — the bar a drafted player has to clear.';

function renderReport(container, report, onBack = null) {
  const sections = [
    section('Still on waivers', waiverLines(report.waivers)),
    section('Biggest steals', report.steals.map(stealLine)),
    section('Biggest reaches', report.reaches.map(reachLine)),
    // Not "The league's blind spot": the section holds one row per position and can
    // hold QB, RB, WR and TE at once, so a singular heading is wrong three times in
    // four. This one reads the same over one row and over four.
    section('Where the league was wrong', report.blindSpot.map(blindSpotLine), REPLACEMENT_NOTE),
    // Not "that never start". A bench WR3 starts on a bye week, so "never" states a
    // season-long certainty the data cannot support — and the line underneath already
    // says the accurate thing, that he does not make their starting lineup.
    section('Earliest picks that do not make a starting lineup', report.benched.map(benchLine)),
    section('Team by team', report.teams.map(teamBlock)),

    sections.push(el('button', { class: 'rep-back', text: 'Back to draft', onClick: onBack }, []));

}

__exports.renderReport = renderReport;

__def("ui/setup.js", function (__exports, __req) {
const { el, clear } = __req('ui/dom.js');
const { DEFAULT_CONFIG } = __req('core/state.js');

const SLOT_FIELDS = ['QB', 'RB', 'WR', 'TE', 'FLEX', 'K', 'DEF', 'BENCH'];

// Resizes a form.teams array to exactly `numTeams` entries, preserving surviving
// rows (their name/keeperId/keeperRound) whether growing or shrinking, and
// appending fresh default rows when growing.
function resizeTeams(teams, numTeams) {
  const result = teams.slice(0, numTeams);
  for (let i = result.length; i < numTeams; i += 1) {
    result.push({ name: `Team ${i + 1}`, keeperId: '', keeperRound: '' });
  }
  return result;
}

function buildConfig(form) {
  const numTeams = Number(form.numTeams);
  const rounds = Number(form.rounds);

  const slots = {};
  for (const key of SLOT_FIELDS) slots[key] = Number(form.slots[key]) || 0;

  const teams = form.teams.slice(0, numTeams).map((team, i) => {
    const name = String(team.name || '').trim() || `Team ${i + 1}`;
    const hasPlayer = Boolean(team.keeperId);
    const hasRound = Boolean(String(team.keeperRound ?? '').trim());
    return {
      name,
      keeper: hasPlayer && hasRound
        ? { playerId: String(team.keeperId), round: Number(team.keeperRound) }
        : null,
      // Half a keeper is almost always a mistake — a name typed without picking a
      // suggestion, or a player chosen with the round left at "—". Silently dropping
      // it leaves the player in the pool and the board cell empty, so flag it instead.
      keeperPartial: hasPlayer !== hasRound,
    };
  });

  return {
    ...DEFAULT_CONFIG,
    numTeams,
    rounds,
    myTeamIndex: Number(form.myTeamIndex),
    slots,
    teams,
  };
}

function validateConfig(config) {
  const errors = [];

  if (!(config.numTeams >= 4 && config.numTeams <= 16)) {
    errors.push('Number of teams must be between 4 and 16.');
  }
  if (!(config.rounds >= 1 && config.rounds <= 30)) {
    errors.push('Rounds must be between 1 and 30.');
  }
  if (!(config.myTeamIndex >= 1 && config.myTeamIndex <= config.numTeams)) {
    errors.push(`Draft position must be between 1 and ${config.numTeams}.`);
  }
  if (config.teams.length !== config.numTeams) {
    errors.push(`Team entries (${config.teams.length}) do not match the configured team count (${config.numTeams}).`);
  }

  const slotTotal = SLOT_FIELDS.reduce((sum, key) => sum + (config.slots[key] || 0), 0);
  if (slotTotal !== config.rounds) {
    errors.push(`Roster slots total ${slotTotal} but there are ${config.rounds} rounds — they must match.`);
  }

  const keeperIds = new Set();
  for (const team of config.teams) {
    if (team.keeperPartial) {
      errors.push(`${team.name}: keeper needs both a player and a round.`);
    }
    if (!team.keeper) continue;
    if (keeperIds.has(team.keeper.playerId)) {
      errors.push(`Two teams have the same keeper (${team.name}).`);
    }
    keeperIds.add(team.keeper.playerId);
    if (!(team.keeper.round >= 1 && team.keeper.round <= config.rounds)) {
      errors.push(`${team.name}: keeper round must be between 1 and ${config.rounds}.`);

  const input = el('input', {
    type: 'text',
    placeholder: 'search player…',
    value: selectedId && byId.has(selectedId) ? byId.get(selectedId).name : '',

  const list = el('div', { class: 'suggest-list', style: { display: 'none' } }, []);
  const wrap = el('div', { class: 'suggest' }, [input, list]);

  function close() {

  input.addEventListener('input', () => {

    onChange('');

    if (query.length < 2) {

    }
    const matches = players.filter((p) => p.name.toLowerCase().includes(query)).slice(0, 8);
    for (const p of matches) {
      list.appendChild(el('div', {
        text: `${p.name} — ${p.position} ${p.team}`,

        el('td', {}, [playerPicker(players, team.keeperId, (id) => { form.teams[i].keeperId = id; })]),
        el('td', {}, [el('select', {
          onChange: (e) => { form.teams[i].keeperRound = e.target.value; },

          el('option', { value: '', text: '—' }, []),

        numberField('Rounds', 'rounds', 1, 30, onRoundsChange),
        el('div', { class: 'field' }, [
          el('label', { text: 'Scoring' }, []),
          el('select', { disabled: 'disabled' }, [el('option', { text: 'Standard (non-PPR)' }, [])]),
        ]),

          el('label', { text: 'Draft type' }, []),
          el('select', { disabled: 'disabled' }, [el('option', { text: 'Snake' }, [])]),
        ]),
      ]),
    ]),

    el('div', { class: 'setup-section', dataset: { tour: 'position' } }, [
      el('h2', { text: 'Your Draft Position' }, []),

    ]),

      el('h2', { text: 'Roster Slots' }, []),

      // Fixed-height scroller: changing the team count adds or removes rows inside
